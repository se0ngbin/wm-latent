defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/Dubins-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: random # ckpt name or random

# LE-WM dubins was trained with frameskip=1 and a single 1-D action per step,
# so action_block=1 (no action macro-stacking, unlike pushT's 5).
plan_config:
  horizon: 12
  receding_horizon: 4
  action_block: 1

# Dataset-driven eval: replay expert dubins trajectories. Goal is placed at the
# episode END (goal_at_episode_end), so the goal image's green marker sits at the
# true target and `_set_goal_state` reproduces it. Each env starts goal_offset
# steps before its episode's final frame.
eval:
  num_eval: 50
  goal_offset_steps: 12
  goal_at_episode_end: true
  eval_budget: 30
  img_size: 224
  world_image_shape: [128, 128]  # native dubins render size; policy transform resizes to img_size for the model
  dataset_name: dubins_expert
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: dubins_results.txt
