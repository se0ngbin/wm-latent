_target_: safe_solver.SoftSafeCEMSolver
model: ???
batch_size: 1
num_samples: 300
var_scale: 1.0
n_steps: 30
topk: 30
device: "cuda"
seed: ${seed}
# cost = goal_mse + unsafe_const * 1[any violation] + unsafe_weight * sum_t relu(unsafe_margin - h(z_t)) on imagined latents
margin_ckpt: ???
unsafe_weight: 1.0
unsafe_margin: 0.0   # scalar, or a list with one margin per imagined step
unsafe_const: 0.0   # + const * 1[any h < margin]; > max goal cost (~130) => lexicographic
goal_cost: final   # final (last imagined step, JEPA.criterion) | mean (every imagined step)
h_quantile: null   # p: per-replan rank-normalized h (bottom p of imagined latents read unsafe); null = raw h
h_steps: null   # n: safety cost on the first n imagined steps only; null = all
h_rel: false   # true: margin = h(current real frame) + unsafe_margin (threshold-free; penalize going lower on h than now)
ccem: false   # true: SafeDreamer constrained-CEM elite rule (OSRP CCEPlanner) instead of the soft cost
ccem_cost_limit: 2.0   # SafeDreamer osrp default
